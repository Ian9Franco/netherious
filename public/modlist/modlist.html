<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Netherious IV — Modlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Outfit:wght@380;500;640&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0c0b10;
            --panel: rgba(22, 18, 26, 0.88);
            --line: rgba(243, 230, 214, 0.12);
            --velvet: #7a314f;
            --velvet-deep: #3d1728;
            --glow: #e0a0b8;
            --almond: #f4e7d8;
            --dim: #cbb8a6;
            --muted: #8d7b6e;
            --hearth: #e7c4a2;
            --dusk: #9eb4c6;
            --sage: #b7c4a4;
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }
        * { box-sizing: border-box; }
        html { scroll-padding-top: 5.5rem; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--almond);
            font-family: Outfit, sans-serif;
            line-height: 1.45;
            background:
                radial-gradient(900px 380px at 12% -10%, rgba(122, 49, 79, 0.45), transparent 70%),
                radial-gradient(700px 320px at 100% 0%, rgba(158, 180, 198, 0.12), transparent 60%),
                var(--ink);
        }
        button, input { font: inherit; color: inherit; }
        button { cursor: pointer; }
        .wrap { width: min(1440px, calc(100% - 2rem)); margin: 0 auto; }
        .hero { padding: 2.4rem 0 0.4rem; max-width: 46rem; }
        .eyebrow {
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-size: 0.72rem;
            font-weight: 640;
            color: var(--hearth);
        }
        h1 {
            margin: 0.3rem 0 0.45rem;
            font-family: Fraunces, serif;
            font-weight: 650;
            font-size: clamp(3rem, 7vw, 5.2rem);
            line-height: 0.9;
            letter-spacing: -0.045em;
        }
        h1 em { font-style: italic; font-weight: 500; color: var(--glow); }
        .lede { margin: 0; color: var(--dim); font-size: 1.05rem; }
        .stats { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1.15rem 0 0.3rem; }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            border: 1px solid var(--line);
            background: rgba(12, 11, 16, 0.45);
            border-radius: 999px;
            padding: 0.28rem 0.7rem 0.28rem 0.28rem;
            color: var(--dim);
            font-size: 0.84rem;
        }
        .pill b {
            min-width: 1.7rem;
            text-align: center;
            background: var(--velvet-deep);
            color: var(--almond);
            border-radius: 999px;
            padding: 0.16rem 0.45rem;
        }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 5;
            padding: 0.75rem 0;
            background: linear-gradient(var(--ink) 65%, rgba(12, 11, 16, 0));
        }
        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-items: center;
            padding: 0.55rem;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: rgba(18, 15, 22, 0.92);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }
        .search {
            flex: 1 1 220px;
            min-width: 0;
            background: #0c0b10;
            border: 1px solid transparent;
            border-radius: 11px;
            padding: 0.7rem 0.85rem;
            outline: none;
        }
        .search:focus { border-color: var(--glow); }
        .search::placeholder { color: var(--muted); }
        .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
        .chip, .tool {
            border: 1px solid var(--line);
            background: transparent;
            border-radius: 999px;
            padding: 0.45rem 0.75rem;
        }
        .chip[aria-pressed="true"], .tool:hover, .chip:hover, .tool:focus-visible, .chip:focus-visible {
            border-color: var(--glow);
            color: var(--hearth);
            outline: none;
        }
        .meta { color: var(--dim); font-size: 0.82rem; min-width: 6.5rem; }
        .layout {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.8rem;
            align-items: start;
        }
        .side {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
            padding: 0.85rem;
            min-width: 0;
        }
        .side[hidden] { display: none; }
        .side-client { box-shadow: inset 3px 0 0 var(--glow); }
        .side-both { box-shadow: inset 3px 0 0 var(--hearth); }
        .side-server { box-shadow: inset 3px 0 0 var(--dusk); }
        .side-head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: flex-start; }
        .kicker { margin: 0; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; }
        h2 { margin: 0.1rem 0 0.25rem; font-family: Fraunces, serif; font-weight: 500; font-size: 1.7rem; }
        h2 span { color: var(--dim); font-size: 0.95rem; }
        .side-desc { margin: 0 0 0.7rem; color: var(--dim); font-size: 0.88rem; }
        .cat { border-top: 1px solid var(--line); }
        .cat.is-hidden { display: none; }
        .cat-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.55rem;
            text-align: left;
            background: transparent;
            border: 0;
            padding: 0.72rem 0.15rem;
        }
        .cat-btn:hover .cat-label, .cat-btn:focus-visible .cat-label { color: var(--hearth); }
        .chev {
            width: 0.45rem;
            height: 0.45rem;
            border-right: 1.5px solid var(--dim);
            border-bottom: 1.5px solid var(--dim);
            transform: rotate(-45deg);
            flex: none;
        }
        .cat.is-open .chev { transform: rotate(45deg) translate(-1px, -1px); }
        .cat-label { font-weight: 640; }
        .cat-count {
            margin-left: auto;
            color: var(--dim);
            font-variant-numeric: tabular-nums;
            font-size: 0.82rem;
        }
        .cat-desc { display: none; margin: -0.15rem 0 0.45rem 1rem; color: var(--muted); font-size: 0.8rem; }
        .cat.is-open .cat-desc { display: block; }
        .cat-body { display: none; padding: 0 0 0.7rem 1rem; }
        .cat.is-open .cat-body { display: block; }
        .file {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: 0;
            border-radius: 8px;
            padding: 0.28rem 0.4rem;
            color: var(--almond);
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 0.74rem;
            line-height: 1.35;
            word-break: break-word;
        }
        .file:hover, .file:focus-visible { background: rgba(224, 160, 184, 0.08); outline: none; }
        .file.is-hidden { display: none; }
        .file mark {
            background: transparent;
            color: var(--hearth);
            font-weight: 500;
        }
        .packs { margin: 0.8rem 0 2.4rem; display: grid; gap: 0.8rem; }
        .pack {
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel);
            padding: 0.85rem 1rem 0.4rem;
            box-shadow: inset 3px 0 0 var(--sage);
        }
        .pack[hidden] { display: none; }
        .empty {
            display: none;
            margin: 0.4rem 0 1rem;
            padding: 0.9rem 1rem;
            border: 1px dashed rgba(224, 160, 184, 0.4);
            border-radius: 14px;
            color: var(--dim);
        }
        .empty.visible { display: block; }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.2rem;
            transform: translateX(-50%) translateY(12px);
            background: var(--almond);
            color: var(--ink);
            border-radius: 999px;
            padding: 0.55rem 0.9rem;
            font-weight: 640;
            opacity: 0;
            pointer-events: none;
            transition: 0.2s ease;
        }
        .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
        .foot { color: var(--muted); font-size: 0.8rem; padding-bottom: 2rem; }
        @media (max-width: 980px) {
            .layout { grid-template-columns: 1fr; }
        }
    </style>
</head>

    <script>
        const data = JSON.parse(document.getElementById("modlist-data").textContent);
        const sidesEl = document.getElementById("sides");
        const packsEl = document.getElementById("packs");
        const q = document.getElementById("q");
        const meta = document.getElementById("meta");
        const empty = document.getElementById("empty");
        const toast = document.getElementById("toast");
        let filter = "all";
        let toastTimer;

        function countFiles(groups) {
            return groups.reduce((n, g) => n + g.files.length, 0);
        }
        function sideCount(side) {
            return side.categories.reduce((n, c) => n + c.files.length, 0);
        }
        document.getElementById("lede").textContent =
            "Categorías tomadas de las carpetas. Actualizado " + data.updated + ". Un clic copia el nombre del archivo.";
        const stats = document.getElementById("stats");
        const statItems = [
            ["Cliente", data.sides[0] ? sideCount(data.sides.find(s => s.id === "client")) : 0],
            ["Both", sideCount(data.sides.find(s => s.id === "both"))],
            ["Servidor", sideCount(data.sides.find(s => s.id === "server"))],
            ["Texturas", countFiles(data.packs.find(p => p.id === "resourcepacks").groups)],
            ["Shaders", countFiles(data.packs.find(p => p.id === "sha").groups)],
            ["Datapack", countFiles(data.packs.find(p => p.id === "datapack").groups)]
        ];
        stats.innerHTML = statItems.map(([name, n]) => `<span class="pill"><b>${n}</b> ${name}</span>`).join("");
        document.getElementById("foot").textContent =
            "Fuera de esta lista: asignar/ (todavía sin carpeta) y no/ (mods retirados). Compartidos repite jars que ya están en both.";

        function fileButton(name) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "file";
            btn.dataset.name = name.toLowerCase();
            btn.textContent = name;
            btn.title = "Copiar nombre";
            btn.addEventListener("click", () => copyText(name, name));
            return btn;
        }
        function makeCategory(cat, open) {
            const art = document.createElement("article");
            art.className = "cat" + (open ? " is-open" : "");
            art.dataset.folder = cat.folder.toLowerCase();
            art.dataset.label = (cat.label || "").toLowerCase();
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "cat-btn";
            btn.innerHTML = `<span class="chev" aria-hidden="true"></span><span class="cat-label"></span><span class="cat-count"></span>`;
            btn.querySelector(".cat-label").textContent = cat.label;
            const count = btn.querySelector(".cat-count");
            count.textContent = String(cat.files.length);
            count.dataset.total = String(cat.files.length);
            btn.addEventListener("click", () => art.classList.toggle("is-open"));
            art.appendChild(btn);
            if (cat.desc) {
                const p = document.createElement("p");
                p.className = "cat-desc";
                p.textContent = cat.desc;
                art.appendChild(p);
            }
            const body = document.createElement("div");
            body.className = "cat-body";
            cat.files.forEach(name => body.appendChild(fileButton(name)));
            art.appendChild(body);
            return art;
        }
        data.sides.forEach(side => {
            const sec = document.createElement("section");
            sec.className = "side side-" + side.id;
            sec.dataset.side = side.id;
            sec.innerHTML = `<div class="side-head"><div><p class="kicker"></p><h2></h2></div><button type="button" class="tool copy-side">Copiar</button></div><p class="side-desc"></p>`;
            sec.querySelector(".kicker").textContent = side.kicker;
            sec.querySelector("h2").innerHTML = `${side.title} <span>${sideCount(side)}</span>`;
            sec.querySelector(".side-desc").textContent = side.desc;
            sec.querySelector(".copy-side").addEventListener("click", () => copyText(treeForSide(side), side.title));
            side.categories.forEach(cat => sec.appendChild(makeCategory(cat, false)));
            sidesEl.appendChild(sec);
        });
        data.packs.forEach(pack => {
            const sec = document.createElement("section");
            sec.className = "pack";
            sec.dataset.side = "packs";
            sec.dataset.pack = pack.id;
            sec.innerHTML = `<div class="side-head"><div><p class="kicker"></p><h2></h2></div></div><p class="side-desc"></p>`;
            sec.querySelector(".kicker").textContent = pack.kicker;
            const n = countFiles(pack.groups);
            sec.querySelector("h2").innerHTML = `${pack.title} <span>${n}</span>`;
            sec.querySelector(".side-desc").textContent = pack.desc;
            pack.groups.forEach(group => sec.appendChild(makeCategory(group, false)));
            packsEl.appendChild(sec);
        });

        const filters = document.getElementById("filters");
        [["all", "Todo"], ["client", "Cliente"], ["both", "Both"], ["server", "Servidor"], ["packs", "Packs"]].forEach(([id, label]) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "chip";
            b.textContent = label;
            b.dataset.filter = id;
            b.setAttribute("aria-pressed", id === "all" ? "true" : "false");
            b.addEventListener("click", () => {
                filter = id;
                filters.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.filter === id ? "true" : "false"));
                apply();
            });
            filters.appendChild(b);
        });

        function visibleSide(el) {
            if (filter === "all") return true;
            if (filter === "packs") return el.dataset.side === "packs";
            return el.dataset.side === filter;
        }
        function apply() {
            const query = q.value.trim().toLowerCase();
            let shown = 0;
            document.querySelectorAll(".side, .pack").forEach(sec => {
                const sideOk = visibleSide(sec);
                let sideHits = 0;
                sec.querySelectorAll(".cat").forEach(cat => {
                    const catMatch = !query || cat.dataset.folder.includes(query) || cat.dataset.label.includes(query);
                    let hits = 0;
                    cat.querySelectorAll(".file").forEach(file => {
                        const ok = !query || catMatch || file.dataset.name.includes(query);
                        file.classList.toggle("is-hidden", !ok);
                        if (ok) hits += 1;
                    });
                    const showCat = sideOk && hits > 0;
                    cat.classList.toggle("is-hidden", !showCat);
                    if (query && showCat) cat.classList.add("is-open");
                    if (!query) cat.classList.remove("is-open");
                    const count = cat.querySelector(".cat-count");
                    count.textContent = query ? `${hits}/${count.dataset.total}` : count.dataset.total;
                    sideHits += showCat ? hits : 0;
                });
                sec.hidden = !sideOk || sideHits === 0;
                if (!sec.hidden) shown += sideHits;
            });
            const total = statItems.reduce((n, x) => n + x[1], 0);
            meta.textContent = query || filter !== "all" ? `${shown} visibles` : `${total} archivos`;
            empty.classList.toggle("visible", shown === 0);
        }
        q.addEventListener("input", apply);

        let opened = false;
        document.getElementById("toggle").addEventListener("click", () => {
            opened = !opened;
            document.querySelectorAll(".cat:not(.is-hidden)").forEach(cat => cat.classList.toggle("is-open", opened));
            document.getElementById("toggle").textContent = opened ? "Cerrar todo" : "Abrir todo";
        });

        function treeLines(rootName, categories) {
            const lines = [`+---${rootName}`];
            categories.forEach((cat, index) => {
                const last = index === categories.length - 1;
                const branch = last ? "\\---" : "+---";
                const pad = last ? "|           " : "|   |       ";
                lines.push("|   " + branch + cat.folder);
                cat.files.forEach(name => lines.push(pad + name));
                if (!last) lines.push("|   |");
            });
            return lines;
        }
        function treeForSide(side) {
            return treeLines(side.id, side.categories).join("\n");
        }
        function fullTree() {
            const chunks = data.sides.map(treeForSide);
            data.packs.forEach(pack => chunks.push(treeLines(pack.kicker, pack.groups).join("\n")));
            return chunks.join("\n\n");
        }
        document.getElementById("copy-all").addEventListener("click", () => copyText(fullTree(), "árbol completo"));
        async function copyText(text, label) {
            try {
                await navigator.clipboard.writeText(text);
                showToast("Copiado: " + label);
            } catch (err) {
                showToast("No se pudo copiar");
            }
        }
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add("visible");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove("visible"), 1800);
        }
        apply();
    </script>
</body>
</html>
